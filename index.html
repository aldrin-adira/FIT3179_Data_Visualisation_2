<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/grids-responsive-min.css">
        
        <title>Pet Ownership in Australia</title>
    </head>
    <body>
        <div class="header">
            <div class="main-title">
                <h1>Pet Ownership in Australia</h1>
                <p class="subtitle">Exploring the trends, economic costs, and welfare realities behind one of the world's highest pet-owning nations.</p>
            </div>
        </div>
        
        <div class="sections">
            <!-- Section 1 -->
            <div class="pure-g section-1">
                <!-- Title of section using 100% of the row size -->
                <div class="pure-u-1 section-title">
                    <h2>Section 1</h2>
                    <p class="section-body">
                        This section uses an asymmetrical layout. The first chart takes up two-thirds of the screen, while the second takes up one-third.
                    </p>
                </div>
                
                <!-- Chart 1 using 2/3rds of the row size on medium or larger screens -->
                <div class="pure-u-md-2-3 chart-container">
                    <div id="chart1_chart"></div>
                </div>
                
                <!-- Chart 2 using 1/3rds of the row size on medium or larger screens -->
                <div class="pure-u-md-1-3 chart-container">
                    <div id="chart2_chart"></div>
                </div>
            </div>
        </div>
    </body>
</html>
